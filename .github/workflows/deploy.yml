name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

# Allows the workflow to publish to Pages. Nothing here can write to the repo.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run waits rather than racing an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fails the build on a TypeScript or content-schema error, so a broken
      # site is never published.
      - run: npx astro check

      # Fails if a colour is hardcoded outside the token file.
      - run: npm run check:tokens

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
