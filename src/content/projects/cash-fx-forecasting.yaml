  notes:
    - >-
      The deployment was recognised externally: Silver for Best AI Deployment at
      the TMI Awards 2023, issued by Treasury Management International in March
      2024.
    - >-
      No headline accuracy figure is quoted here. An unqualified percentage
      invites the reader to assume a metric and a horizon that were never
      stated, and forecast error in a treasury context is not a single number:
      it varies by entity, by liquidity item and by how far ahead the question
      is asked.
    - >-
      The greater part of the difficulty lies upstream of the model in any case.
      Establishing what the distinct liquidity items are, mapping transactions
      reliably, and constructing consistent history from data that does not
      arrive in that condition determine the result more than the choice of
      model does. A model fitted to inconsistent history produces confident and
      incorrect forecasts, and that error does not appear in the model's own
      diagnostics.
    - >-
      The operating condition is worth stating plainly, because it shaped every
      decision above: a daily cycle, a position that has to be funded before
      cut-off, thousands of entities behind it, and no budget for paid tooling.

# ---- 6. MANDATORY: limitations and what's next ----
limitations:
  - >-
    This system runs inside a group treasury under contract. It is described
    here at capability level only: no internal system names, no architecture
    detail, and no data. There is no repository to inspect and no demo to run,
    and that is a real limitation of this case study as evidence, the external
    award and the published outcomes are the verifiable parts.
  - >-
    The binding constraint throughout was budget, not technique. Without
    unlimited cloud resources or paid subscriptions, model choice and compute
    were bounded by what open-source tooling could do on the hardware available,
    which rules out approaches that would have been worth testing.
  - >-
    It ran locally before it ran on Azure, which limited how much could be
    scheduled, monitored or recovered automatically during that period.
  - >-
    "TK: beyond budget, which entity types or flows forecast worst? Where does
    automated model selection pick badly? What breaks when a new country is
    onboarded? If these cannot be described under NDA, say so and I will publish
    that sentence instead. The section stays either way. (Q-F11)"
