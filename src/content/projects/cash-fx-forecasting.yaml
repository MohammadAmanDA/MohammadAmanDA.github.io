title: Cash & FX Forecasting System
order: 1
status: production
kind: professional

brief:
  problem: >-
    Cash and FX forecasting across 27 countries and approximately 2,200 legal
    entities. Every entity has its own payment rhythm, they aggregate into a
    daily position that has to be funded before cut-off, and most of the
    preparation was manual and spread across spreadsheets and SharePoint.
  approach: >-
    Automated model selection per entity, because hand-tuning thousands of series
    is not realistic. A pipeline that maps payment platform exports and bank
    statement text into liquidity categories. A a TF-IDF matcher for payment
    categorisation with confidence scoring, so low-confidence cases route to human
    review and those decisions feed retraining. R Shiny applications on Azure so
    country teams manage their own forecasts.
  outcome: >-
    Running in production. Manual forecast preparation reduced by approximately
    75 percent, manual categorisation by approximately 85 percent, and one
    daily close from five or six hours to two or three. The
    deployment received Silver for Best AI Deployment at the TMI Awards 2023.
# You suggested "SaaS". I have not used it, because it would be inaccurate: this
# is an internal system built for one treasury and deployed on the employer's
# own Azure tenancy, not software sold as a service to customers. A technical
# reader would query it immediately. Say the word if you want it anyway.
category: Production ML · time-series forecasting
confidential: true
period:
  start: "2023-04"
  end: "2026-07"
stack:
  - R
  - R Shiny
  - Python
  - Prophet
