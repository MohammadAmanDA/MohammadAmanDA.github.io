# ---- 1. what it does, and who for ----
summary: >-
  An end-to-end cash and FX forecasting system running in production in a
  multinational group treasury, predicting end-of-day and short-term liquidity
  across 27 countries and roughly 2,200 legal entities.
forWhom: >-
  Treasury, Tax and Finance teams who have to fund the right accounts, in the
  right currencies, before the market closes.

# ---- 2. context and constraints ----
context:
  - >-
    A group treasury of this scale does not present a single forecasting
    problem. Each legal entity in each country has its own payment periodicity,
    seasonality and set of inbound platforms, and these aggregate into a daily
    position that must be funded before cut-off.
  - >-
    The system covers the flows that determine that position: sales receipts,
    tax, finance and controlling flows, and supplier payments. Error in either
    direction carries a cost, since surplus balances are unremunerated and
    shortfalls require short-notice borrowing.
  - >-
    Prior to this system much of the preparation was manual, and the supporting
    workflow was distributed across spreadsheets and SharePoint.
constraints:
  - >-
    No budget. There were no unlimited cloud resources and no paid
    subscriptions available for this, so the entire forecasting system was built
    on open-source components and ran at zero software cost.
  - >-
    It had to work locally before it could work anywhere else. The system began
    as a local R Shiny application and was only later hosted on Azure, so the
    architecture had to be something that ran on a laptop and then scaled up,
    not something that assumed a platform from day one.
  - >-
    "TK: were there other hard constraints, a daily cut-off the pipeline had to
    finish inside, data residency rules, an audit or explainability
    requirement? I removed three plausible-sounding constraints I had written
    from inference rather than from you. (Q-F17)"

# ---- 3. my role ----
myRole:
  - >-
    Cash & FX Forecast Specialist at FAMI Ltd (IKEA Group Treasury) from April
    2023 to July 2026, working with Treasury, Tax and Finance stakeholders to
    turn operational requirements into working systems.
  - >-
    Built with one colleague, with me as the lead. Every machine learning model
    in the system was mine, as were the data managers that feed them, the
    reporting layer around them, and the dashboards treasury teams use.
  - >-
    The scope extended beyond forecasting. It comprised identifying and
    separating the distinct categories of liquidity item, implementing the
    processes that read and map incoming transactions, assembling consistent
    historical series from bank statement data that did not arrive in a usable
    form, the forecasting itself, and the visualisation layer through which the
    output was consumed.

# ---- 4. technical approach ----
approach:
  - decision: Automate model selection rather than pick one model
    detail:
      - >-
        With entities numbering in the thousands, no single forecasting model
        is right for all of them, a large national sales entity and a small
        holding company have nothing in common statistically.
      - >-
        Rather than hand-tune, the system scores candidate models per entity and
        selects the best performer automatically. The candidate set spans
        Prophet, ARIMA and XGBoost, which cover different shapes of series:
        strong seasonality, autocorrelated residuals, and cases where exogenous
        features carry more signal than the history does.
      - >-
        That turns a modelling problem that does not scale into an evaluation
        problem that does.
  - decision: Treat the data pipeline as the real product
    detail:
      - >-
        Forecast quality is bounded by input quality, and treasury inputs
        arrive as bank statements and platform reports rather than as clean
        series.
      - >-
        The pipeline ingests multiple external payment platforms, including
        PayPal and Amex, and maps their output automatically into liquidity
        categories, so new sources plug into a known shape rather than
        requiring bespoke handling.
      - >-
        Bank statement data was structured into reliable historical series by
        combining deterministic parsing logic with NLP for the free-text fields,
        where the description is the only clue to what a line item actually is.
  - decision: Classify transactions with a model, but keep humans in the loop
    detail:
      - >-
        Payment volume runs above 50,000 a day, which is far past the point
        where manual categorisation is viable. A TF-IDF matcher
        assigns categories, and every prediction carries a confidence score.
      - >-
        Low-confidence predictions route to a human review queue rather than
        flowing straight through, and those human decisions feed back into
        retraining. The model gets better where it is weakest, and the cases it
        is unsure about never silently become wrong data downstream.
      - >-
        "TK: the confidence threshold, the share of volume routed to review, and
        whether retraining runs on a schedule or is triggered manually. Real
        numbers or none, this is the most interesting part of the design and
        it is currently unquantified. (Q-G5, Q-G6)"
  - decision: Deploy as applications treasury teams operate themselves
    detail:
      - >-
        The forecasting system and the supporting country-level applications
        are R Shiny apps deployed on Azure, so country teams manage their own
        forecasts directly instead of requesting changes through a central
        queue.
      - >-
        Separate applications cover tax flows and finance-and-controlling flows,
        which have different owners and different review cycles.
      - >-
        Workflows that previously lived in SharePoint were migrated onto cloud
        infrastructure as part of the same programme.
  - decision: Report forecast against actuals as a first-class output
    detail:
      - >-
        A forecasting system that does not publish its own error is asking to be
        trusted rather than earning it. Reporting frameworks compare forecast to
        actuals so the teams relying on the number can see how it has been
        performing.
  - decision: Add an agentic layer on top, not underneath
    detail:
      - >-
        An agentic AI workflow built on internal tooling and R pipelines fetches
        live data, evaluates the current forecasts against it, and produces
        presentation-ready insight for stakeholders.
      - >-
        It sits above a deterministic forecasting core rather than replacing any
        part of it, the numbers are produced by models that can be audited, and
        the agent handles retrieval, evaluation and communication.

