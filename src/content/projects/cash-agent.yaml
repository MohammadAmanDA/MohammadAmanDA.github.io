limitations:
  - >-
    No measured accuracy. Until answers are checked against a known-correct set,
    the honest claim is that the approach is sound, not that the results are
    reliable.
  - >-
    Canonical mapping is the single point of failure. A column mapped to the
    wrong canonical name produces a confident and wrong answer, in exactly the
    way the deterministic design is meant to prevent.
  - >-
    Personal project, not production. It has not been run against a real finance
    function's document set at volume.
  - >-
    "TK: which document formats are supported today, and what happens when a
    column cannot be mapped to anything? (Q-N5)"
nextSteps:
  - Measure accuracy against a question set with known-correct answers.
  - Automate downstream actions rather than only answering questions.

