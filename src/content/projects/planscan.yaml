# ---- 6. MANDATORY: limitations and what's next ----
limitations:
  - >-
    24 of Ireland's 31 councils are covered. For the remainder the system falls
    back to general planning law, which is flagged in the report but is much
    less useful than a real plan-backed answer.
  - >-
    The evaluation set is 11 appeal decisions. Zero fabricated citations across
    eleven cases is a real result and a small sample; it is evidence the
    refusal behaviour works, not a measured accuracy figure at scale.
  - >-
    Retrieval quality is bounded by a small embedding model running over
    several-hundred-page statutory documents. Where a development plan is
    ambiguous, the model's verdict inherits that ambiguity.
  - >-
    Runs locally only. There is no deployed instance, so there is nothing to try
    without cloning and installing it, and the code is not yet on GitHub.
  - >-
    The deterministic validation layer covers the councils whose approved
    newspaper lists have been entered, not every council.
nextSteps:
  - Finish ingesting the remaining development plans and update the number here.
  - Put the code under version control and publish the repository, after rotating the API key currently sitting in the working directory and starting a clean history.
  - Deploy a demo instance so the tool can be tried rather than described.
  - Evaluate verdicts against decided applications to get a real accuracy figure.

