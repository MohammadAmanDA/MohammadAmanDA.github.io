title: PlanScan
order: 5
status: in-progress
category: Retrieval, vector search, LLM
kind: personal
confidential: false

brief:
  problem: >-
    Irish planning applications are refused on planning grounds or invalidated on
    procedural ones. The procedural failures are knowable before submission, but
    the rules sit across a statutory development plan of several hundred pages
    that differs for each of Ireland's 31 local authorities.
  approach: >-
    Development plans are chunked with overlap and embedded locally into a
    persistent vector store. Retrieval runs separately for each compliance
    criterion, because the passages covering drainage and overlooking sit in
    different parts of the document, then the results go to a language model in a
    single structured call. Fee arithmetic, statutory notice windows and approved
    newspaper lists are computed deterministically and never reach the model.
  outcome: >-
    Around 8,200 development plan sections indexed across 24 Irish councils,
    scored against 12 planning criteria. Evaluated on 11 real appeal decisions
    with zero fabricated citations. Not deployed; runs locally.
period:
  start: "2026"
  end: null
stack:
  - Python
