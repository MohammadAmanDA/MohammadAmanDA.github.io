# Three capability cards, matching the reference structure.
# All figures sourced from resume.md and your approved list.

- id: forecasting
  order: 1
  label: Forecasting & Liquidity Systems
  title: Production Cash & FX Forecasting
  detail: >-
    End-to-end forecasting across a multi-entity treasury, from raw bank
    statement text through to the application the business runs on.
  bullets:
    - Automated model selection across Prophet, ARIMA and XGBoost, scored per entity
    - Bank statement parsing with NLP for the free-text fields
    - Payment platform exports mapped automatically to liquidity categories
    - R Shiny applications deployed on Azure for country-level forecast management
  impact: >-
    Removed roughly 75 percent of manual forecast preparation across 27 countries
    and 2,200 legal entities, and took one recurring reporting workflow from
    five or six hours to two or three.
  metric: 27 Countries · 2,200 Entities
  tech: [R / R SHINY, PYTHON, PROPHET, ARIMA, XGBOOST, AZURE, POSTGRESQL]

- id: applied-ml
  order: 2
  label: Applied ML & Document Intelligence
  title: Classification & Retrieval Systems
  detail: >-
    Models in front of real operational volume, with the deterministic parts of
    the problem deliberately kept out of the model.
  bullets:
    - TF-IDF transaction matching over 50,000+ payments a day
    - Confidence-scored routing to human review, feeding retraining
    - Canonical column mapping before any reasoning, so answers are computed not generated
    - Retrieval over statutory documents with per-criterion search
  impact: >-
    Removed roughly 85 percent of manual transaction categorisation and improved
    downstream reporting consistency, with uncertain cases escalated rather than
    flowing through as silent errors.
  metric: 50,000+ Payments / Day
  tech: [DISTILBERT, SCIKIT-LEARN, PANDAS, CHROMADB, SENTENCE-TRANSFORMERS]

- id: engineering
  order: 3
  label: Data Engineering & Automation
  title: Pipelines, Mapping & Reporting
  detail: >-
    The upstream work that decides whether anything downstream can be trusted,
    plus the automation that stops it being done by hand twice.
  bullets:
    - Consistent historical series assembled from sources that disagree on schema
    - Reconciliation between platform exports and bank statement records
    - Scheduled pipelines replacing recurring manual preparation
    - Forecast against actuals reporting, so error stays visible
  impact: >-
    Cut the daily close from five or six hours to two or three by automating
    categorisation of more than 50,000 daily bank transactions, and replaced
    120-day country forecasts kept in Excel with a modelled pipeline.
  metric: 120-day horizon · 27 countries
  tech: [PYTHON, SQL, POSTGRESQL, POWER BI, POWER AUTOMATE, GITHUB ACTIONS]
