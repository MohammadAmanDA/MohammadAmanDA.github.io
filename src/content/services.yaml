- id: forecasting
  order: 1
  title: Cash and liquidity forecasting
  detail: >-
    Building short-horizon forecasts across many entities and currencies, where
    each entity has its own payment rhythm and the aggregate has to be funded to
    a deadline. Includes automated model selection where hand-tuning thousands of
    series is not realistic, and reporting that compares forecast against actuals
    so the error is visible rather than assumed.

- id: pipelines
  order: 2
  title: Data preparation for forecasting
  detail: >-
    Turning bank statements and payment platform exports into consistent
    historical series: parsing, mapping transactions to categories, and
    reconciling sources that disagree. This is usually where forecast quality is
    won or lost, and it is most of the work on any real forecasting system.

- id: classification
  order: 3
  title: Transaction classification
  detail: >-
    Categorising high volumes of payments with a trained classifier, with
    confidence scoring so uncertain cases route to human review instead of
    flowing through as silent errors, and a feedback loop so those decisions
    improve the model.

- id: automation
  order: 4
  title: Reporting and workflow automation
  detail: >-
    Replacing recurring manual preparation with scheduled pipelines and
    applications that the business operates itself. Built with R, Python, SQL and
    Power BI, deployed on Azure.

- id: retrieval
  order: 5
  title: Retrieval over document sets
  detail: >-
    Prototyping retrieval-augmented systems that answer questions against a
    defined corpus, with the deterministic parts of the problem kept out of the
    model. This is project-based work rather than professional experience, and I
    would take it on at prototype scale only.
