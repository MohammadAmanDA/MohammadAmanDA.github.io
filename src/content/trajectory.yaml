  org: FAMI Ltd, IKEA Group Treasury
  location: Dublin, Ireland
  title: Cash & FX Forecast Specialist
  subtitle: Treasury Forecasting Platform · Applied Time Series · LLM Agents
  summary: >-
    Built the treasury forecasting platform end to end with its users, starting
    from 120-day country forecasts kept in Excel and rarely updated. Awarded
    Silver for Best AI Deployment at the TMI Awards 2023.
  bullets:
    - Delivered a PostgreSQL data model, Python, R and SQL pipelines, and an R Shiny app used daily across 27 countries.
    - Compared per-entity ARIMA, Prophet and XGBoost in time-ordered backtests on MAPE, weighted MAPE and bias, choosing a champion per entity and reaching 90%+ accuracy on key items.
    - Tracked forecast against actuals in production with deviation flags and error codes per country; found late submissions mattered as much as model choice.
    - Built an LLM agent for weekly deviation analysis, keeping every calculation in deterministic code and validating outputs against manual runs before the team relied on it.
    - Chose TF-IDF matching over a supervised model because labels were sparse, with a review queue for low-confidence cases; automated categorisation of 50K+ daily bank transactions and cut the daily close from five or six hours to two or three.
    - Built a Copilot Studio agent for country users, wrote user guides, trained colleagues and onboarded finance teams on-site across Europe.
  tech: [PYTHON, R / SHINY, SQL, POSTGRESQL, DOCKER, AZURE, POWER BI, ARIMA, PROPHET, XGBOOST, TF-IDF, COPILOT STUDIO]

