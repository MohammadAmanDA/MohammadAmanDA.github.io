# Forecasting workflow stages for the Architecture Workbench.
# From your described pipeline and resume.md. Throughput values describe the
# cadence rather than claiming a measured latency.

- id: ingest
  diagram: cashfx
  order: 1
  tag: Raw Sources
  title: Statement & Platform Ingest
  summary: Bank statements and payment platform exports
  latency: Scheduled
  edge: Raw records
  governance: Inside tenancy
  responsibilities:
    - Pulls bank statement files and payment platform exports on a schedule.
    - Handles formats as they arrive rather than requiring a fixed schema.
    - Records what landed, so a missing file is visible rather than silent.
  safeguard: No data leaves the organisation's own infrastructure.
  tech:
    - Python
    - SQL
    - Azure

- id: clean
  diagram: cashfx
  order: 2
  tag: Cleaning
  title: Parsing & Normalisation
  summary: NLP over free-text statement fields
  latency: Per batch
  edge: Parsed rows
  governance: Deterministic first
  responsibilities:
    - Parses structured fields with ordinary rules, not a model.
    - Applies NLP only to the free-text description, where it is the single clue to what a line item is.
    - Flags rows it cannot parse instead of guessing at them.
  safeguard: Unparseable rows are escalated, never silently dropped.
  tech:
    - Python
    - SQL

- id: map
  diagram: cashfx
  order: 3
  tag: Mapping
  title: Transaction Classification
  summary: TF-IDF with confidence-scored review
  latency: 50,000+ / day
  edge: Categorised flows
  governance: Human in the loop
  responsibilities:
    - Assigns a liquidity category to every payment, with a confidence score attached.
    - Routes low-confidence cases to a human review queue rather than letting them through.
    - Feeds those human decisions back into retraining, so the model improves where it is weakest.
  safeguard: Uncertain predictions never reach downstream reporting unreviewed.
  tech:
    - TF-IDF
    - Python

- id: series
  diagram: cashfx
  order: 4
  tag: History
  title: Clean Historical Series
  summary: Consistent history per entity
  latency: Per entity
  edge: Training data
  governance: Reconciled
  responsibilities:
    - Assembles consistent history from sources that disagree with each other.
    - Reconciles platform exports against bank statement records.
    - Produces the series the models are actually fitted on.
  safeguard: A model fitted to inconsistent history forecasts confidently and wrongly, so this stage gates the next.
  tech:
    - SQL
    - PostgreSQL

- id: models
  diagram: cashfx
  order: 5
  tag: Model Selection
  title: Automated Model Selection
  summary: Prophet, ARIMA and XGBoost per entity
  latency: Per entity
  edge: Selected model
  governance: Best model wins
  responsibilities:
    - Scores candidate models for every entity and selects the best performer automatically.
    - Covers different shapes of series, strong seasonality, autocorrelated residuals, and exogenous drivers.
    - Turns a modelling problem that does not scale into an evaluation problem that does.
  safeguard: No entity depends on a single hand-tuned model.
  tech:
    - R
    - Prophet
    - ARIMA
    - XGBoost

- id: forecast
  diagram: cashfx
  order: 6
  tag: Output
  title: Forecast & Monitoring
  summary: R Shiny on Azure, forecast against actuals
  latency: Daily cycle
  edge: Funding decision
  governance: Self-served
  responsibilities:
    - Publishes end-of-day and short-term liquidity forecasts to the teams that fund the position.
    - Country teams manage their own forecasts rather than queueing for a central change.
    - Compares forecast against actuals so the error stays visible.
  safeguard: A forecasting system that does not publish its own error is asking to be trusted rather than earning it.
  tech:
    - R Shiny
    - Azure
    - Power BI

# ---------------------------------------------------------------------------
# PlanScan, second workbench tab.
#
# Every line below is drawn from src/content/projects/planscan.yaml, which the
# owner supplied and approved. Nothing here introduces a fact, a number or a
# technology that the case study does not already stand behind: the stack is
# exactly its published stack, and the figures (~8,200 sections, 12 criteria,
# 11 appeal decisions, zero fabricated citations) are its published figures.
# ---------------------------------------------------------------------------

- id: ps-route
  diagram: planscan
  order: 1
  tag: Routing
  title: Eircode to Council
  summary: Postcode resolved to the governing authority
  latency: Per request
  edge: Council and plan
  governance: Deterministic
  responsibilities:
    - Maps an Eircode to the local authority that governs the site.
    - Selects that council's development plan, so every later stage reads the right statutory document.
    - Removes the lookup an applicant would otherwise have to get right first.
  safeguard: Which council applies is resolved from the postcode in code, never inferred by a model.
  tech:
    - Python
    - SQLite

- id: ps-index
  diagram: planscan
  order: 2
  tag: Indexing
  title: Plan Ingest & Embedding
  summary: Statutory plans chunked and embedded on CPU
  latency: ~8,200 sections
  edge: Vector store
  governance: Stays local
  responsibilities:
    - Chunks development plans with overlap, so a policy split across a page boundary is still retrievable.
    - Computes 384-dimension embeddings locally on CPU with a small sentence-transformer model.
    - Writes them to a persistent local vector store rather than a hosted service.
  safeguard: Documents stay on the machine, which is what the council-facing case requires.
  tech:
    - Python
    - ChromaDB
    - sentence-transformers

- id: ps-rules
  diagram: planscan
  order: 3
  tag: Rules
  title: Deterministic Validation
  summary: Fees, notice windows and approved newspapers, in code
  latency: No model call
  edge: Procedural verdicts
  governance: By construction
  responsibilities:
    - Tests the newspaper against the council's approved list as a set membership check.
    - Computes the statutory notice window by date arithmetic, and the fee by formula.
    - Compares the description on the form against the one in the notice for consistency.
  safeguard: This layer costs nothing and cannot fabricate a result, so judgement is never asked for where arithmetic will do.
  tech:
    - Python

- id: ps-retrieve
  diagram: planscan
  order: 4
  tag: Retrieval
  title: Per-Criterion Retrieval
  summary: A separate search for each compliance criterion
  latency: 12 criteria
  edge: Ranked passages
  governance: Source-bound
  responsibilities:
    - Searches separately per criterion, because drainage and overlooking sit in different parts of a plan.
    - Deduplicates the results, re-ranks them by relevance and truncates to the strongest passages.
    - Returns nothing when a council's plan has not been indexed, and the report is flagged as unbacked.
  safeguard: With no retrieved source the system refuses, rather than answering from general knowledge.
  tech:
    - Python
    - ChromaDB
    - sentence-transformers

- id: ps-judge
  diagram: planscan
  order: 5
  tag: Judgement
  title: One Structured Call
  summary: Strict JSON, every criterion in a single request
  latency: One call
  edge: Scored verdicts
  governance: Low temperature
  responsibilities:
    - Sends the retrieved passages for all criteria in one generation call, not one call per criterion.
    - Requires strict JSON, a verdict per criterion with a confidence score, the finding and its plan reference.
    - Holds temperature low, so the same proposal does not score differently between runs.
  safeguard: The model is used only where the question needs a development plan read and a judgement formed.
  tech:
    - Llama 3.3 70B (Groq)
    - Python

- id: ps-report
  diagram: planscan
  order: 6
  tag: Output
  title: Report & Audit Trail
  summary: Pass, warning, fail or missing information
  latency: Local only
  edge: Pre-submission report
  governance: Fails visibly
  responsibilities:
    - Reports what passes, what fails and what paperwork is missing, before the application is submitted.
    - Returns a structured error report with the raw response attached when parsing fails, instead of crashing.
    - Stores the run, so a verdict can be traced back to the passages behind it.
  safeguard: Evaluated on 11 real appeal decisions with no fabricated citations, every cited rule checked against the retrieved text.
  tech:
    - Streamlit
    - SQLite
    - Python
